[project]
name = "fractal-harness"
version = "0.1.0"
description = "Invariant-aligned coding agents: human-owned rules and verified, self-maintaining facts, enforced before, during and after every edit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fractal = "fractal_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fractal_harness"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/tests"]
pythonpath = ["experiments"]
