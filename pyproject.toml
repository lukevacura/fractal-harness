[project]
name = "fractal-harness"
version = "0.1.0"
description = "Contract-chunked agent harness: verified, self-invalidating claim cache for codebases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
]

[project.scripts]
fractal = "fractal_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fractal_harness"]
